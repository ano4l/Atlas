if(type==='route')content=`<section class="sheet route-sheet"><div class="handle"></div><div class="route-head"><div><h2 class="route-title">Thread &amp; Form</h2><p class="route-meta">Fashion · Level 1 · Store 1.08</p></div><div class="square" style="background:#F1F3F5;color:#4E6776">${icon('shirt')}</div></div><div class="route-data"><b>3 min</b> · 180 m <span>From your position</span></div><div class="sponsor-card"><div><span class="badge">SPONSORED</span><b>Common Ground</b><p>Coffee nearby · optional stop</p></div><button class="add-stop">+ Add stop</button></div><button class="primary">${icon('locate')}Start route</button><p class="route-policy">Your route stays unchanged until you add a stop.</p><p class="sheet-note"><span>Schematic route</span><span>Concept interface</span></p></section>`;

function sidebar(active){return `<aside class="sidebar"><div class="brand"><svg class="brand-mark" viewBox="0 0 28 29"><path d="M2 26 13 3h4l10 23h-6l-6-15-7 15z" fill="currentColor"/><path d="m10 21 12-5 2 5-16 6z" fill="#A5B6FA"/></svg><div>atlas<small>VENUE INTELLIGENCE</small></div></div><div class="venue-switch">${icon('map')}<div><strong>Central Arcade</strong><small>Concept venue</small></div></div><p class="nav-label">WORKSPACE</p>${[['Overview','grid'],['Movement analytics','chart'],['Maps & places','map'],['Advertising','megaphone'],['Audience & consent','users']].map(([n,i])=>`<a class="side-link ${active===n?'active':''}" href="?screen=${n==='Advertising'?'dashboard-advertising':'dashboard-analytics'}">${icon(i)}${n}</a>`).join('')}<div class="side-bottom"><div class="privacy-note">${icon('shield')}<br>Patterns, not identities.<br>Aggregate views protect individual journeys.</div><a class="side-link" href="#">${icon('settings')}Workspace settings</a><div class="profile"><div class="avatar">VA</div><div><b>Venue administrator</b><small>Example workspace</small></div></div></div></aside>`}

function analytics(){return `<article class="desk">${sidebar('Movement analytics')}<section class="workspace">${topLine()}<header class="page-heading"><div><h1>Understand every journey.</h1><p>Observed activity, spatial patterns and the quality behind them.</p></div><div class="filters"><button class="control">${icon('calendar')}28 Oct 2026${icon('chev')}</button><button class="control">Level 1${icon('chev')}</button><button class="control">${icon('download')}Export</button></div></header><section class="kpis"><div class="kpi"><p class="key">Atlas-observed sessions</p><p class="value">1,248 <em>Consenting sample</em></p><p class="desc">Distinct sessions in this reporting window</p></div><div class="kpi"><p class="key">Median dwell</p><p class="value">18.4 <em>min</em></p><p class="desc">Valid, completed zone observations</p></div><div class="kpi"><p class="key">Route completion</p><p class="value">84<span style="font-size:23px">%</span></p><p class="desc">Completed / started eligible routes</p></div><div class="kpi"><p class="key">Reporting zones</p><p class="value">8 <em>Level 1</em></p><p class="desc">Aggregate, privacy-filtered coverage</p></div></section><div class="analytics-grid"><section class="panel"><div class="panel-title"><h2>Where people spend time</h2><span class="pill" style="padding:5px 9px;font-size:9px">Observed activity${icon('chev')}</span></div><p class="panel-sub">Relative intensity · no whole-mall visitor estimate</p><div class="heatmap">${heatMap()}</div><div class="heat-legend">Lower<span class="legend-ramp"></span>Higher <span style="margin-left:auto">Map version CA-L1 · Concept</span></div></section><section class="panel"><div class="panel-title"><h2>The rhythm of the day</h2><small>Observed sessions</small></div><div class="chart-wrap">${timeChart()}</div><div class="chart-foot"><span class="dot"></span>Midday is the busiest observed window</div></section></div><div class="lower-grid"><section class="panel"><div class="panel-title"><h2>Zone breakdown</h2><small>Top reporting zones</small></div><table class="data-table"><thead><tr><th>Zone</th><th>Observed entries</th><th>Median dwell</th></tr></thead><tbody><tr><td><i class="mini-dot"></i>North atrium</td><td>386</td><td>6.2 min</td></tr><tr><td><i class="mini-dot" style="background:#8BA4EE"></i>Food court</td><td>294</td><td>24.8 min</td></tr><tr><td><i class="mini-dot" style="background:#B3C4F1"></i>Fashion walk</td><td>212</td><td>14.1 min</td></tr></tbody></table></section><section class="panel insight"><p class="eyebrow">${icon('spark')}EXAMPLE INSIGHT</p><h3>North atrium draws the<br>strongest midday activity.</h3><p>Review signage and circulation during 12:00–14:00.<br>Validate any change against a comparable period.</p></section></div><div class="quality"><span>Source: opted-in Atlas sessions · 28 Oct, 08:00–20:00 · Example data</span><span>37 low-confidence records excluded · Small cohorts suppressed</span></div></section></article>`}
function advertising(){return `<article class="desk">${sidebar('Advertising')}<section class="workspace">${topLine()}<header class="page-heading" style="margin-bottom:22px"><div><h1>Store visibility, measured.</h1><p>Relevant placements. Transparent delivery. Budgets that stay in control.</p></div><div class="filters"><button class="control">${icon('calendar')}October 2026${icon('chev')}</button><button class="control" style="background:#365CF5;color:white;border-color:#365CF5">+ Create campaign</button></div></header><div class="selection-tabs"><button class="selected">Campaign overview</button><button>Sponsored search</button><button>Route cards</button><button>Billing &amp; venue share</button></div><section class="kpis ads-kpis"><div class="kpi"><p class="key">Budget ceiling</p><p class="value">R18,750</p><p class="desc">Upper limit · not booked revenue</p></div><div class="kpi"><p class="key">Delivered media spend</p><p class="value">R2,096</p><p class="desc">11.2% of available budget</p></div><div class="kpi"><p class="key">Valid billed impressions</p><p class="value">12,348</p><p class="desc">Viewability and deduplication applied</p></div><div class="kpi"><p class="key">Venue share</p><p class="value">R629 <em>30%</em></p><p class="desc">Based on delivered media spend</p></div></section><div class="ads-main"><section class="panel delivery-panel"><div class="panel-title"><h2>What was actually delivered</h2><small>Two complementary placements</small></div><div class="media-chart"><div class="donut"><div class="donut-center">R2,096<small>Delivered media</small></div></div><div class="placement-breakdown"><div class="place-line"><div><i class="mini-dot"></i>Sponsored search<span>9,173 valid impressions · R180 CPM</span></div><b>R1,651</b></div><div class="place-line"><div><i class="mini-dot" style="background:#A9B9FA"></i>Route-preview cards<span>3,175 valid impressions · R140 CPM</span></div><b>R445</b></div></div></div><p class="split-note">Unspent budget remains unbilled. No charge for a route calculation alone.</p></section><section class="panel ad-preview"><div class="panel-title"><h2>A useful moment of discovery</h2><small>Placement preview</small></div><div class="preview-area"><div class="preview-canvas"><div class="preview-search">${icon('search')}Coffee near me</div><div class="preview-store"><div class="square coffee-square">${icon('coffee')}</div><div><span class="badge" style="font-size:8px">SPONSORED</span><b>Common Ground</b><small>Speciality coffee · Level 1 · 90 m</small></div>${icon('arrow','arrow-right')}</div></div><p class="preview-foot">${icon('shield')}Clearly labelled. Organic alternatives stay visible.</p></div></section></div><section class="panel campaign-panel"><div class="panel-title"><h2>Campaign examples</h2><small>Fictional retailers · managed placements</small></div><table class="data-table campaign-table"><thead><tr><th>Placement / example creative</th><th>Format</th><th>Valid impressions</th><th>Delivered spend</th><th>Status</th></tr></thead><tbody><tr><td>Common Ground · Your next coffee</td><td>Sponsored search</td><td>9,173</td><td>R1,651</td><td><span class="example-label">Example</span></td></tr><tr><td>Common Ground · Along your route</td><td>Route-preview card</td><td>3,175</td><td>R445</td><td><span class="example-label">Example</span></td></tr></tbody></table></section><div class="footer-ribbon"><span>Atlas after venue share <b>R1,467</b></span><span>Before media servicing and platform costs</span><span style="margin-left:auto;font-size:10px">Rounded illustration · Unspent budget is not revenue</span></div><div class="quality"><span>Concept data · Example period and allocations · No real campaign delivery</span><span>Optional stop selection · No forced route deviation</span></div></section></article>`}
const root=document.getElementById('root'),s=new URLSearchParams(location.search).get('screen');
const captions=[['app-map','01 / Find your place','Map-first discovery with saved and recent destinations.'],['app-search','02 / Discover what is nearby','Labelled sponsored results alongside organic alternatives.'],['app-route','03 / Choose your journey','Useful store discovery with an explicit optional stop.'],['app-guidance','04 / Arrive with confidence','Clear route guidance without advertising interruptions.']];
if(s?.startsWith('app-')&&s!=='app-overview'){document.body.className='standalone-app';root.innerHTML=mobile(s)}else if(s==='dashboard-analytics'||s==='dashboard-advertising'){document.body.className='standalone-desk';root.innerHTML=s==='dashboard-analytics'?analytics():advertising()}else{root.innerHTML=`<section class="gallery ${s==='app-overview'?'overview':''}"><header class="gallery-title"><div><h1>atlas <span>/ A clearer way through.</span></h1><p>Consumer app concepts · Central Arcade · Schematic venue and illustrative states</p></div><span class="sample-pill">PRODUCT CONCEPTS</span></header><div class="gallery-phones">${captions.map(([n,t,d])=>`<div class="phone-wrap">${mobile(n)}<h2>${t}</h2><p>${d}</p></div>`).join('')}</div>${s==='app-overview'?'':`<div class="gallery-dashboard"><h2>Venue movement analytics</h2>${analytics()}</div><div class="gallery-dashboard"><h2>Retailer advertising and delivery</h2>${advertising()}</div>`}</section>`}
</script></body></html>
