name: Atlas checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace:
    name: TypeScript, mobile and contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm lint
      - run: corepack pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: corepack pnpm typecheck
      - run: corepack pnpm test
      - name: Export Android and iOS test bundles
        run: |
          corepack pnpm --filter mobile exec expo export --platform android --output-dir "$RUNNER_TEMP/atlas-android"
          corepack pnpm --filter mobile exec expo export --platform ios --output-dir "$RUNNER_TEMP/atlas-ios"
        env:
          EXPO_PUBLIC_ATLAS_API_URL: http://127.0.0.1:18080

  platform:
    name: Platform API and PostGIS
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/platform-api
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '21'
      - run: docker info
      - run: bash ./gradlew --no-daemon check bootJar
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'
      - run: corepack pnpm install --frozen-lockfile
        working-directory: .
      - name: Compare backend and offline routes
        run: ./tests/end-to-end/run-map-package-flow.ps1 -CheckRouteParity -CheckScenarios
        shell: pwsh
        working-directory: .

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Scan Git history
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz \
            --output "$archive"
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner .
