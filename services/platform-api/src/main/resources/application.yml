spring:
  application:
    name: platform-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/indoor_navigation}
    username: ${DATABASE_USERNAME:atlas}
    password: ${DATABASE_PASSWORD:atlas}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
