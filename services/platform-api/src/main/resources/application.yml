spring:
  application:
    name: platform-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:55432/indoor_navigation}
    username: ${DATABASE_USERNAME:atlas}
    password: ${DATABASE_PASSWORD:atlas}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v1/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Interim admin authentication until an IdP is chosen (techspec.md §20).
# Semicolon-separated "secret:ROLE1,ROLE2" entries. Must be overridden per env.
atlas:
  security:
    admin-api-keys: ${ADMIN_API_KEYS:changeme:PLATFORM_ADMIN,MAPPING_OPERATOR}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
